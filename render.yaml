services:
  - type: web
    name: animesoul
    runtime: static
    buildCommand: echo "static site - nothing to build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
